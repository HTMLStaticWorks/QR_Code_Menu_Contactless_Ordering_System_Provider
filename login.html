<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your QRServe account and manage your restaurant's digital menu and contactless ordering system." />
  <link rel="canonical" href="https://qrserve.io/login" />
  <title>Login — QRServe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/rtl.css" />

  <style>
    .auth-layout {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #e0f2fe 0%, #f8fafc 50%, #f0f9ff 100%);
      padding: 3rem 1.25rem 2rem;
      position: relative;
    }
    [data-theme="dark"] .auth-layout {
      background: var(--clr-bg);
    }

    .auth-visual {
      display: none !important;
    }

    .auth-form-panel {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .auth-form-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-form-wrap {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid var(--clr-border);
      border-radius: 24px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    [data-theme="dark"] .auth-form-wrap {
      background: var(--clr-surface);
      border-color: var(--clr-border);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      width: 100%;
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--clr-border-strong);
      border-radius: 50px;
      background: var(--clr-surface);
      font-size: var(--size-small);
      font-weight: 600;
      color: var(--clr-text-primary);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
    }
    .social-btn:hover {
      border-color: var(--clr-secondary);
      background: var(--clr-secondary-light);
    }
    [data-theme="dark"] .social-btn:hover {
      background: rgba(0, 200, 150, 0.1);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    .auth-form-wrap .form-label {
      font-weight: 700;
      font-size: 0.875rem;
      margin-block-end: 0.5rem;
      color: var(--clr-text-primary);
      display: block;
    }

    .auth-form-wrap .form-input {
      background: #f4f5f7;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      box-shadow: none;
      width: 100%;
    }
    [data-theme="dark"] .auth-form-wrap .form-input {
      background: var(--clr-surface-2);
      border-color: var(--clr-border);
    }
    .auth-form-wrap .form-input:focus {
      background: var(--clr-surface);
      border-color: var(--clr-secondary);
      box-shadow: 0 0 0 3px rgba(0, 200, 150, 0.15);
      outline: none;
    }

    .auth-form-wrap .btn--primary {
      border-radius: 50px;
      background: var(--clr-secondary);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 1rem;
      border: none;
      box-shadow: 0 8px 16px rgba(0, 200, 150, 0.25);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      margin-top: 0.5rem;
      width: 100%;
    }
    .auth-form-wrap .btn--primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(0, 200, 150, 0.35);
    }

    .auth-link-row {
      text-align: center;
      font-size: var(--size-small);
      color: var(--clr-text-secondary);
      margin-block-start: var(--sp-4);
    }

    .auth-link-row a {
      color: var(--clr-secondary);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @media (max-width: 480px) {
      .auth-layout {
        padding: 4.5rem 1rem 2rem;
      }
      .auth-form-wrap {
        padding: 2rem 1.25rem;
        border-radius: 20px;
      }
    }

    [dir="rtl"] .form-checkbox {
      flex-direction: row !important;
    }

    .auth-title {
      font-size: clamp(1.15rem, 2.2vw, 1.35rem) !important;
      font-weight: 700 !important;
    }
  </style>
</head>
<body>

  <!-- Floating Outside Top-Right Preferences (Theme & RTL) -->
  <div class="auth-corner-actions" aria-label="Display Preferences">
    <button class="icon-btn" data-theme-toggle data-theme-icon aria-label="Toggle dark mode" title="Toggle theme"></button>
    <button class="icon-btn" data-rtl-btn aria-label="Switch to RTL" title="Switch direction"></button>
  </div>

  <div class="auth-layout">

    <div class="auth-form-panel">
      <div class="auth-form-container">
        <div class="auth-form-wrap">

          <!-- Authentication Card Header with Logo, Page Name Badge, and Title -->
          <div class="auth-card-header">
            <a href="index.html" class="auth-card-logo" aria-label="QRServe — Return to Home">
              <div class="auth-card-logo__icon" aria-hidden="true">
                <i class="ri-qr-code-line"></i>
              </div>
              <span class="auth-card-logo__text">QR<span>Serve</span></span>
            </a>
            <h1 class="auth-title">Sign In to QRServe</h1>
            <p class="auth-subtitle">Enter your restaurant credentials to access your dashboard</p>
          </div>

          <!-- Alert -->
          <div class="form-alert form-alert--error" role="alert" aria-live="polite"></div>

          <!-- Login Form -->
          <form class="auth-form" id="login-form" novalidate aria-label="Sign in form">
            <div class="form-group">
              <label class="form-label" for="login-email">Email Address <span aria-hidden="true">*</span></label>
              <div class="form-input-wrap">
                <input
                  class="form-input"
                  type="email"
                  id="login-email"
                  name="email"
                  placeholder="you@restaurant.com"
                  required
                  autocomplete="email"
                  aria-required="true"
                  aria-describedby="email-error"
                />
              </div>
              <span class="form-error" id="email-error" role="alert"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="login-password">Password <span aria-hidden="true">*</span></label>
              <div class="form-input-wrap">
                <input
                  class="form-input"
                  type="password"
                  id="login-password"
                  name="password"
                  placeholder="Enter your password"
                  required
                  autocomplete="current-password"
                  aria-required="true"
                  aria-describedby="password-error"
                />
                <button type="button" class="form-input-icon-end" data-toggle-password="login-password" aria-label="Show password">
                  <i class="ri-eye-line"></i>
                </button>
              </div>
              <span class="form-error" id="password-error" role="alert"></span>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center; margin-bottom: 0.5rem;">
              <label class="form-checkbox" for="remember-me">
                <input type="checkbox" id="remember-me" name="remember" />
                <span class="form-checkbox__label">Remember me for 30 days</span>
              </label>
              <a href="#" style="font-size:var(--size-xs);color:var(--clr-secondary);">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn--primary btn--full btn--lg" id="login-submit-btn">
              Sign In
            </button>
          </form>

          <div class="form-divider" style="margin-block: 2rem;">or continue with</div>

          <!-- Social Login -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.625rem; margin-block-end:var(--sp-4);">
            <button class="social-btn" type="button" aria-label="Continue with Google">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Google
            </button>
            <button class="social-btn" type="button" aria-label="Continue with Apple">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
              Apple
            </button>
          </div>

          <div class="auth-link-row" style="text-align: center; margin-top: 1.5rem;">
            Don't have an account? <a href="register.html" style="color: var(--clr-secondary); font-weight: 600;">Create one free</a>
          </div>

          <!-- Return to Homepage Link -->
          <div style="text-align: center; margin-block-start: 1.25rem;">
            <a href="index.html" class="auth-return-link" aria-label="Return to Homepage">
              <i class="ri-arrow-left-line"></i> Return to Homepage
            </a>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/forms.js"></script>
</body>
</html>
